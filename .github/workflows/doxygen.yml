#
# Update Doxygen-generated docs whenever we commit to `main`.
#
# The docs are published with GitHub’s own Pages actions, so the repository’s
# Pages source (Settings → Pages → Build and deployment) must be set to
# “GitHub Actions”. Every action is pinned to a full commit SHA, with its tag
# in a comment; update both together.

name: Doxygen GitHub Pages Update Action

on:
  push:
    branches:
      - main

# Only one deployment at a time; don’t cancel one that’s already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Use a shallow clone to keep Doxygen focused.
          fetch-depth: 0
          submodules: "true"

      - name: Install dependencies
        # `noble` only includes `doxygen-1.9.x`; we install a newer version 
        # below.
        run: sudo apt update && sudo apt install -y graphviz wget
        shell: bash

      - name: Install Doxygen
        run: |
          doxygen_version='1.17.0'
          doxygen_dir_version="$(tr '.' '_' <<< "${doxygen_version}")"

          temp_dir="$(mktemp -d "doxygen.XXXXXX")"
          trap 'rm -rf "${temp_dir}"' EXIT

          # SEEME (bitweeder) The archive is checked against a SHA-256 taken
          # from the release asset when this version was adopted (trust on
          # first use); Doxygen doesn’t publish checksums. Update the hash
          # together with the version.
          doxygen_sha256='75419ef4f446fc1c24ef12514b574e66e898ee6f527c6ae2ad84f91a905823c2'
          doxygen_archive="doxygen-${doxygen_version}.linux.bin.tar.gz"

          pushd "${temp_dir}" >/dev/null || exit 31
            wget "https://github.com/doxygen/doxygen/releases/download/Release_${doxygen_dir_version}/${doxygen_archive}" \
            || exit 32

            echo "${doxygen_sha256}  ${doxygen_archive}" | sha256sum -c - \
            || exit 36

            tar xf "${doxygen_archive}" \
            || exit 33

            mkdir -p "/usr/local/bin" \
            || exit 34

            sudo mv \
              "doxygen-${doxygen_version}/bin/doxygen" \
              "/usr/local/bin/doxygen" \
            || exit 35
          popd >/dev/null
        shell: bash

      # Use the newest GCC installed on the image.
      - name: Select Toolchain
        run: |
          gcc_version="$(ls /usr/bin/g++-[0-9]* | sed 's|.*/g++-||' | grep -E '^[0-9]+$' | sort -n | tail -1)"
          [ -n "${gcc_version}" ] && [ -x "/usr/bin/gcc-${gcc_version}" ] \
          || { echo "No versioned GCC found"; exit 51; }

          echo "CC=gcc-${gcc_version}" >> "${GITHUB_ENV}"
          echo "CXX=g++-${gcc_version}" >> "${GITHUB_ENV}"
          "g++-${gcc_version}" --version
        shell: bash

      - name: Generate docs
        # We run a full CMake build for this as some input files are 
        # dynamically generated.
        run: |
          mkdir -p build > /dev/null \
          || exit 41

          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLBAL_BUILD_DOCS=ON \
          || exit 42

          cmake --build build \
          || exit 43

          # Top-level redirect
          cp -n \
            "docs/index.html" \
            "build/docs/doxygen/index.html" \
          || exit 45
        shell: bash

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: "build/docs/doxygen"

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

...
