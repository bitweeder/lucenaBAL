# Continuous integration for `main` and release tags: runs the build-and-test
# matrix in `ci-matrix.yml` and keeps each platform’s install archive; a `v*`
# tag also creates a draft release from them. Branches starting with `develop`
# use `develop.yml` instead; other branches run no CI.

name: Build Matrix

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/ci-matrix.yml
    with:
      # Each entry’s archive feeds the release job on `v*` tags.
      upload_archives: true

  # On a `v*` tag, create a draft release holding every entry’s archive.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Release
    runs-on: ubuntu-26.04
    needs: build
    permissions:
      contents: write

    steps:
    - name: Download archives
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        pattern: "*.tar.xz"
        path: ./archives
        merge-multiple: true

    - name: Create draft release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      shell: bash
      run: |
        gh release create "${GITHUB_REF_NAME}" \
          --draft \
          --verify-tag \
          --title "Release ${GITHUB_REF_NAME}" \
          ./archives/*.tar.xz

...
