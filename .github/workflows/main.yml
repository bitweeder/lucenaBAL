# Configure GitHub actions for continuous integration.
#
# Based on examples presented by Cristian Adam at <https://cristianadam.eu/20191222/using-github-actions-with-c-plus-plus-and-cmake/>.
# Uses CMake as a multiplatform scripting language to simplify management.

name: Build Matrix

on: [push]

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    env:
      # Make every `ctest` invocation print the output of failing tests.
      CTEST_OUTPUT_ON_FAILURE: 1
    strategy:
      fail-fast: false
      matrix:
        config:
        - # Currently macOS 26.5.1 and Xcode 26.5
          name: "macOS-26/Xcode/libc++"
          artifact: "macOS-AppleClang-libcpp.tar.xz"
          os: macos-26
          build_type: "Release"
          cc: "clang"
          cxx: "clang++"
        - # Currently Ubuntu 26.04 LTS and gcc 15.2
          name: "Ubuntu-26.04/gcc/libstdc++"
          artifact: "linux64-gcc-libstdcpp.tar.xz"
          os: ubuntu-26.04
          build_type: "Release"
          cc: "gcc-15"
          cxx: "g++-15"
        - # Currently Windows Server 2025 and MSVS 18.7
          name: "Windows-2025/MSVS/Microsoft"
          artifact: "win64-msvc-microsoft.tar.xz"
          os: windows-2025-vs2026
          build_type: "Release"
          cc: "cl"
          cxx: "cl"

          # Partial path to ENV setup script for MSVC
          environment_script: "VC/Auxiliary/Build/vcvars64.bat"

    steps:
    - uses: actions/checkout@v7

    - name: Configure
      env:
        CC: ${{ matrix.config.cc }}
        CXX: ${{ matrix.config.cxx }}
      shell: cmake -P {0}
      run: |
        # Manually set up the shell environment for MSVS since we’re not coming
        # in through the Developer Command Prompt.
        if ("${{ runner.os }}" STREQUAL "Windows"
            AND NOT "x${{ matrix.config.environment_script }}" STREQUAL "x")
          find_program(
            vswhere_exec 
            NAMES
              vswhere 
            PATHS 
              "$ENV{ProgramFiles\(x86\)}/Microsoft Visual Studio/Installer"
              "$ENV{ProgramFiles}/Microsoft Visual Studio/Installer"
            REQUIRED
          )

          message(
            STATUS
              "Found vswhere at: ${vswhere_exec}"
          )

          # FIXME
          # `latest` should be replaced with an appropriate version string.
          execute_process(
            COMMAND
              "${vswhere_exec}" -products * -latest -prerelease -property installationPath
            OUTPUT_VARIABLE
              vs_install_path
            OUTPUT_STRIP_TRAILING_WHITESPACE
          )

          message(
            STATUS
              "Found MSVC install dir at: ${vs_install_path}"
          )


          execute_process(
            COMMAND
              "${vs_install_path}/${{ matrix.config.environment_script }}" && set
            OUTPUT_FILE
              environment_script_output.txt
            RESULT_VARIABLE
              result
          )

          if (NOT result EQUAL 0)
            message(FATAL_ERROR "Converting Windows env failed: ${result}")
          endif()

          file(
            STRINGS
              environment_script_output.txt output_lines)

          foreach(line IN LISTS output_lines)
            if (line MATCHES "^([a-zA-Z0-9_-]+)=(.*)$")
              set(
                ENV{${CMAKE_MATCH_1}} "${CMAKE_MATCH_2}")
            endif()
          endforeach()
        endif()

        execute_process(
          COMMAND
            cmake
              -S .
              -B build
              -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }}
              -DLBAL_BUILD_FALSE_POSITIVE_TESTS=ON
              # The newest Standard the compiler supports, unless the
              # `LBAL_FALSE_POSITIVE_TEST_STANDARDS` repository variable asks
              # for more, e.g. `17;20;23;latest`. Quoted to keep a list intact.
              "-DLBAL_FALSE_POSITIVE_TEST_STANDARDS=${{ vars.LBAL_FALSE_POSITIVE_TEST_STANDARDS || 'latest' }}"
              -DLBAL_BUILD_FALSE_NEGATIVE_TESTS=ON
              # Likewise for the false-negative tests (which cover up through
              # C++23), via the `LBAL_FALSE_NEGATIVE_TEST_STANDARDS` variable.
              "-DLBAL_FALSE_NEGATIVE_TEST_STANDARDS=${{ vars.LBAL_FALSE_NEGATIVE_TEST_STANDARDS || 'latest' }}"
          RESULT_VARIABLE
            result
        )

        if (NOT result EQUAL 0)
          message(FATAL_ERROR "CMake configure failed: ${result}")
        endif()

    - name: Build
      id: build
      shell: cmake -P {0}
      run: |
        # Manually set up the shell environment for MSVS since we’re not coming
        # in through the Developer Command Prompt.
        if ("${{ runner.os }}" STREQUAL "Windows"
            AND NOT "x${{ matrix.config.environment_script }}" STREQUAL "x")
          file(
            STRINGS
              environment_script_output.txt output_lines)

          foreach(line IN LISTS output_lines)
            if (line MATCHES "^([a-zA-Z0-9_-]+)=(.*)$")
              set(ENV{${CMAKE_MATCH_1}} "${CMAKE_MATCH_2}")
            endif()
          endforeach()
        endif()

        execute_process(
          COMMAND
            cmake 
              --build build
              --config ${{ matrix.config.build_type }}
          RESULT_VARIABLE
            result
        )

        if (NOT result EQUAL 0)
          message(FATAL_ERROR "CMake build failed: ${result}")
        endif()


    - name: Test
      id: test
      shell: cmake -P {0}
      run: |
        include(ProcessorCount)
        ProcessorCount(N)

        # `-C` is required with multi-config generators (MSVS); without it,
        # `add_test` tests are reported as unavailable and
        # `gtest_discover_tests` registers nothing. Single-config generators
        # ignore it. `--no-tests=error` keeps an empty test run from passing.
        execute_process(
          COMMAND
            ctest
              -j ${N}
              -C ${{ matrix.config.build_type }}
              --output-on-failure
              --no-tests=error
          WORKING_DIRECTORY
            build
          RESULT_VARIABLE
            result
        )
        if (NOT result EQUAL 0)
          message(FATAL_ERROR "Running tests failed: ${result}")
        endif()


    - name: Failed Test Output
      if: failure() && steps.test.outcome == 'failure'
      shell: cmake -P {0}
      run: |
        # Rerun only the tests that failed, serially, so their complete output
        # is grouped together at the end of the log. The job has already
        # failed, so the result is deliberately ignored.
        execute_process(
          COMMAND
            ctest
              -C ${{ matrix.config.build_type }}
              --rerun-failed
              --output-on-failure
          WORKING_DIRECTORY
            build
        )


    - name: Upload Test Log
      if: failure() && steps.test.outcome == 'failure'
      uses: actions/upload-artifact@v7
      with:
        # Keyed by runner, as matrix names contain `/`, which artifact names
        # can’t.
        name: test-log-${{ matrix.config.os }}
        path: build/Testing/Temporary/LastTest*.log


    # The hard false-positive probes are excluded from the default build so a
    # failing one can’t stop the tests from being built and run; this builds
    # them all, keeping going after errors so every false positive is listed.
    - name: False-Positive Probes
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      shell: cmake -P {0}
      run: |
        # Manually set up the shell environment for MSVS since we’re not coming
        # in through the Developer Command Prompt.
        if ("${{ runner.os }}" STREQUAL "Windows"
            AND NOT "x${{ matrix.config.environment_script }}" STREQUAL "x")
          file(
            STRINGS
              environment_script_output.txt output_lines)

          foreach(line IN LISTS output_lines)
            if (line MATCHES "^([a-zA-Z0-9_-]+)=(.*)$")
              set(ENV{${CMAKE_MATCH_1}} "${CMAKE_MATCH_2}")
            endif()
          endforeach()
        endif()

        # MSBuild and Xcode already report every failing source in a target.
        load_cache(build READ_WITH_PREFIX "" CMAKE_GENERATOR)
        set(keep_going)
        if (CMAKE_GENERATOR STREQUAL "Unix Makefiles")
          set(keep_going -- -k)
        elseif (CMAKE_GENERATOR MATCHES "^Ninja")
          set(keep_going -- -k 0)
        endif()

        execute_process(
          COMMAND
            cmake
              --build build
              --config ${{ matrix.config.build_type }}
              --target lbalFalsePositiveProbes
              ${keep_going}
          RESULT_VARIABLE
            result
        )

        if (NOT result EQUAL 0)
          message(FATAL_ERROR "False-positive probes failed to compile: ${result}")
        endif()


    - name: Install Strip
      run: cmake --install build --prefix instdir --strip


    - name: Pack
      working-directory: instdir
      run: cmake -E tar cJfv ../${{ matrix.config.artifact }} .


    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        path: ./${{ matrix.config.artifact }}
        name: ${{ matrix.config.artifact }}

  release:
    if: contains(github.ref, 'tags/v')
    name: Release
    runs-on: ubuntu-24.04
    needs: build

    steps:
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: true
        prerelease: false

    - name: Store Release url
      run: |
        echo "${{ steps.create_release.outputs.upload_url }}" > ./upload_url

    - uses: actions/upload-artifact@v7
      with:
        path: ./upload_url
        name: upload_url

  publish:
    if: contains(github.ref, 'tags/v')
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: "macOS-latest/Xcode/libc++"
          artifact: "macOS-AppleClang-libcpp.tar.xz"
          os: macos-latest
        - name: "Ubuntu-latest/gcc/libstdc++"
          artifact: "linux64-gcc-libstdcpp.tar.xz"
          os: ubuntu-latest
        - name: "Windows-latest/MSVS/Microsoft"
          artifact: "win64-msvc-microsoft.tar.xz"
          os: windows-latest
    needs: release

    steps:
    - name: Download artifact
      uses: actions/download-artifact@v8
      with:
        name: ${{ matrix.config.artifact }}
        path: ./
        merge-multiple: true

    - name: Download URL
      uses: actions/download-artifact@v8
      with:
        name: upload_url
        path: ./
        merge-multiple: true
    - id: set_upload_url
      run: |
        upload_url=`cat ./upload_url`
        echo ::set-output name=upload_url::$upload_url

    - name: Upload to Release
      id: upload_to_release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.set_upload_url.outputs.upload_url }}
        asset_path: ./${{ matrix.config.artifact }}
        asset_name: ${{ matrix.config.artifact }}
        asset_content_type: application/x-gtar
...
