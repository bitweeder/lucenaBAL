#
# The build-and-test matrix, as a reusable workflow: every platform builds the
# library and its tests, runs both feature-detection suites, and builds the
# compile-only false-positive probes. `main.yml` (for `main` and `v*` tags)
# and `develop.yml` (for `develop*` branches) call it; change the matrix here.
#
# Based on examples presented by Cristian Adam at <https://cristianadam.eu/20191222/using-github-actions-with-c-plus-plus-and-cmake/>.
# Uses CMake as a multiplatform scripting language to simplify management.

name: Build and Test

on:
  workflow_call:
    inputs:
      standards:
        # The `-std` modes for both suites, e.g. `17;20;23;latest`. When
        # empty, the `LBAL_FALSE_POSITIVE_TEST_STANDARDS` and
        # `LBAL_FALSE_NEGATIVE_TEST_STANDARDS` repository variables apply, and
        # otherwise `latest`.
        description: "Standard modes for both test suites"
        type: string
        default: ""
      upload_archives:
        # Install, pack and upload each entry’s archive, for `main.yml`’s
        # release job. Failing tests’ logs are uploaded either way.
        description: "Upload each entry’s install archive"
        type: boolean
        default: false

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    # An entry with `experimental: true` reports its failures without failing
    # the run; use it while a new entry is being brought up, then remove it.
    continue-on-error: ${{ matrix.config.experimental || false }}
    env:
      # Make every `ctest` invocation print the output of failing tests.
      CTEST_OUTPUT_ON_FAILURE: 1
    strategy:
      fail-fast: false
      matrix:
        config:
        # Each runner is the newest LTS (or equivalent) image for its OS, and
        # the `Select Toolchain` step picks the newest released tools on it,
        # so tool versions float with the images; each job logs what it chose.
        - name: "macOS/Xcode/libc++"
          artifact: "macOS-AppleClang-libcpp.tar.xz"
          os: macos-26
          build_type: "Release"
        - name: "Ubuntu-LTS/gcc/libstdc++"
          artifact: "linux64-gcc-libstdcpp.tar.xz"
          os: ubuntu-26.04
          build_type: "Release"
        - name: "Windows-Server/MSVS/Microsoft"
          artifact: "win64-msvc-microsoft.tar.xz"
          os: windows-2025-vs2026
          build_type: "Release"

          # Partial path to ENV setup script for MSVC
          environment_script: "VC/Auxiliary/Build/vcvars64.bat"
        # clang-cl with the MSVC STL, through Visual Studio’s ClangCL toolset.
        - name: "Windows-Server/clang-cl/Microsoft"
          artifact: "win64-clangcl-microsoft.tar.xz"
          os: windows-2025-vs2026
          build_type: "Release"
          toolset: "ClangCL"

          # Partial path to ENV setup script for MSVC
          environment_script: "VC/Auxiliary/Build/vcvars64.bat"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    # Use the newest released toolchain on the image: the newest non-beta
    # Xcode on macOS, the newest versioned GCC on Ubuntu, and MSVC (whose
    # newest released Visual Studio is found by `vswhere` in `Configure`).
    - name: Select Toolchain
      shell: bash
      env:
        TOOLSET: ${{ matrix.config.toolset }}
      run: |
        case "${RUNNER_OS}" in
          macOS)
            # Only full version names: this skips betas, release candidates and
            # alias links such as `Xcode_26.app`.
            xcode_app="$(ls -d /Applications/Xcode_*.app | grep -E '/Xcode_[0-9]+\.[0-9]+(\.[0-9]+)?\.app$' | sort -V | tail -1)"
            [ -n "${xcode_app}" ] || { echo "No released Xcode found"; exit 1; }
            sudo xcode-select -s "${xcode_app}/Contents/Developer" || exit 1
            xcodebuild -version
            cc=clang
            cxx=clang++
            ;;
          Linux)
            gcc_version="$(ls /usr/bin/g++-[0-9]* | sed 's|.*/g++-||' | grep -E '^[0-9]+$' | sort -n | tail -1)"
            [ -n "${gcc_version}" ] && [ -x "/usr/bin/gcc-${gcc_version}" ] \
            || { echo "No versioned GCC found"; exit 1; }
            cc="gcc-${gcc_version}"
            cxx="g++-${gcc_version}"
            ;;
          Windows)
            # The Visual Studio generator takes the compiler from its toolset
            # (`-T` in `Configure`), which reports the compiler it found.
            cc=cl
            cxx=cl
            echo "Visual Studio toolset: ${TOOLSET:-default (MSVC)}"
            ;;
          *)
            echo "Unexpected runner OS: ${RUNNER_OS}"
            exit 1
            ;;
        esac

        echo "CC=${cc}" >> "${GITHUB_ENV}"
        echo "CXX=${cxx}" >> "${GITHUB_ENV}"

        if [ "${RUNNER_OS}" != "Windows" ]; then
          "${cxx}" --version
        fi

    - name: Configure
      shell: cmake -P {0}
      run: |
        # Manually set up the shell environment for MSVS since we’re not coming
        # in through the Developer Command Prompt.
        if ("${{ runner.os }}" STREQUAL "Windows"
            AND NOT "x${{ matrix.config.environment_script }}" STREQUAL "x")
          find_program(
            vswhere_exec 
            NAMES
              vswhere 
            PATHS 
              "$ENV{ProgramFiles\(x86\)}/Microsoft Visual Studio/Installer"
              "$ENV{ProgramFiles}/Microsoft Visual Studio/Installer"
            REQUIRED
          )

          message(
            STATUS
              "Found vswhere at: ${vswhere_exec}"
          )

          # Deliberately unpinned: use the newest released (not preview)
          # Visual Studio on the image, like the other jobs’ toolchains.
          execute_process(
            COMMAND
              "${vswhere_exec}" -products * -latest -property installationPath
            OUTPUT_VARIABLE
              vs_install_path
            OUTPUT_STRIP_TRAILING_WHITESPACE
          )

          message(
            STATUS
              "Found MSVC install dir at: ${vs_install_path}"
          )

          execute_process(
            COMMAND
              "${vswhere_exec}" -path "${vs_install_path}" -property catalog_productDisplayVersion
            OUTPUT_VARIABLE
              vs_version
            OUTPUT_STRIP_TRAILING_WHITESPACE
          )

          message(
            STATUS
              "Using Visual Studio ${vs_version}"
          )


          execute_process(
            COMMAND
              "${vs_install_path}/${{ matrix.config.environment_script }}" && set
            OUTPUT_FILE
              environment_script_output.txt
            RESULT_VARIABLE
              result
          )

          if (NOT result EQUAL 0)
            message(FATAL_ERROR "Converting Windows env failed: ${result}")
          endif()

          file(
            STRINGS
              environment_script_output.txt output_lines)

          foreach(line IN LISTS output_lines)
            if (line MATCHES "^([a-zA-Z0-9_-]+)=(.*)$")
              set(
                ENV{${CMAKE_MATCH_1}} "${CMAKE_MATCH_2}")
            endif()
          endforeach()
        endif()

        # A Visual Studio toolset other than the default, e.g. `ClangCL`.
        set(toolset_args)
        if (NOT "x${{ matrix.config.toolset }}" STREQUAL "x")
          set(toolset_args -T "${{ matrix.config.toolset }}")
        endif()

        execute_process(
          COMMAND
            cmake
              -S .
              -B build
              ${toolset_args}
              -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }}
              -DLBAL_BUILD_FALSE_POSITIVE_TESTS=ON
              # The caller’s `standards` input; otherwise the newest Standard
              # the compiler supports, unless the
              # `LBAL_FALSE_POSITIVE_TEST_STANDARDS` repository variable asks
              # for more, e.g. `17;20;23;latest`. Quoted to keep a list intact.
              "-DLBAL_FALSE_POSITIVE_TEST_STANDARDS=${{ inputs.standards || vars.LBAL_FALSE_POSITIVE_TEST_STANDARDS || 'latest' }}"
              -DLBAL_BUILD_FALSE_NEGATIVE_TESTS=ON
              # Likewise for the false-negative tests, via the same input or
              # the `LBAL_FALSE_NEGATIVE_TEST_STANDARDS` variable.
              "-DLBAL_FALSE_NEGATIVE_TEST_STANDARDS=${{ inputs.standards || vars.LBAL_FALSE_NEGATIVE_TEST_STANDARDS || 'latest' }}"
          RESULT_VARIABLE
            result
        )

        if (NOT result EQUAL 0)
          message(FATAL_ERROR "CMake configure failed: ${result}")
        endif()

    - name: Build
      id: build
      shell: cmake -P {0}
      run: |
        # Manually set up the shell environment for MSVS since we’re not coming
        # in through the Developer Command Prompt.
        if ("${{ runner.os }}" STREQUAL "Windows"
            AND NOT "x${{ matrix.config.environment_script }}" STREQUAL "x")
          file(
            STRINGS
              environment_script_output.txt output_lines)

          foreach(line IN LISTS output_lines)
            if (line MATCHES "^([a-zA-Z0-9_-]+)=(.*)$")
              set(ENV{${CMAKE_MATCH_1}} "${CMAKE_MATCH_2}")
            endif()
          endforeach()
        endif()

        execute_process(
          COMMAND
            cmake 
              --build build
              --config ${{ matrix.config.build_type }}
          RESULT_VARIABLE
            result
        )

        if (NOT result EQUAL 0)
          message(FATAL_ERROR "CMake build failed: ${result}")
        endif()


    - name: Test
      id: test
      shell: cmake -P {0}
      run: |
        include(ProcessorCount)
        ProcessorCount(N)

        # `-C` is required with multi-config generators (MSVS); without it,
        # `add_test` tests are reported as unavailable and
        # `gtest_discover_tests` registers nothing. Single-config generators
        # ignore it. `--no-tests=error` keeps an empty test run from passing.
        execute_process(
          COMMAND
            ctest
              -j ${N}
              -C ${{ matrix.config.build_type }}
              --output-on-failure
              --no-tests=error
          WORKING_DIRECTORY
            build
          RESULT_VARIABLE
            result
        )
        if (NOT result EQUAL 0)
          message(FATAL_ERROR "Running tests failed: ${result}")
        endif()


    - name: Failed Test Output
      if: failure() && steps.test.outcome == 'failure'
      shell: cmake -P {0}
      run: |
        # Rerun only the tests that failed, serially, so their complete output
        # is grouped together at the end of the log. The job has already
        # failed, so the result is deliberately ignored.
        execute_process(
          COMMAND
            ctest
              -C ${{ matrix.config.build_type }}
              --rerun-failed
              --output-on-failure
          WORKING_DIRECTORY
            build
        )


    - name: Upload Test Log
      if: failure() && steps.test.outcome == 'failure'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        # Keyed by the entry’s archive name, as matrix names contain `/`,
        # which artifact names can’t, and two entries can share a runner.
        name: test-log-${{ matrix.config.artifact }}
        path: build/Testing/Temporary/LastTest*.log


    # The hard false-positive probes are excluded from the default build so a
    # failing one can’t stop the tests from being built and run; this builds
    # them all, keeping going after errors so every false positive is listed.
    - name: False-Positive Probes
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      shell: cmake -P {0}
      run: |
        # Manually set up the shell environment for MSVS since we’re not coming
        # in through the Developer Command Prompt.
        if ("${{ runner.os }}" STREQUAL "Windows"
            AND NOT "x${{ matrix.config.environment_script }}" STREQUAL "x")
          file(
            STRINGS
              environment_script_output.txt output_lines)

          foreach(line IN LISTS output_lines)
            if (line MATCHES "^([a-zA-Z0-9_-]+)=(.*)$")
              set(ENV{${CMAKE_MATCH_1}} "${CMAKE_MATCH_2}")
            endif()
          endforeach()
        endif()

        # MSBuild and Xcode already report every failing source in a target.
        load_cache(build READ_WITH_PREFIX "" CMAKE_GENERATOR)
        set(keep_going)
        if (CMAKE_GENERATOR STREQUAL "Unix Makefiles")
          set(keep_going -- -k)
        elseif (CMAKE_GENERATOR MATCHES "^Ninja")
          set(keep_going -- -k 0)
        endif()

        execute_process(
          COMMAND
            cmake
              --build build
              --config ${{ matrix.config.build_type }}
              --target lbalFalsePositiveProbes
              ${keep_going}
          RESULT_VARIABLE
            result
        )

        if (NOT result EQUAL 0)
          message(FATAL_ERROR "False-positive probes failed to compile: ${result}")
        endif()


    - name: Install Strip
      if: ${{ inputs.upload_archives }}
      run: cmake --install build --prefix instdir --strip


    - name: Pack
      if: ${{ inputs.upload_archives }}
      working-directory: instdir
      run: cmake -E tar cJfv ../${{ matrix.config.artifact }} .


    - name: Upload
      if: ${{ inputs.upload_archives }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        path: ./${{ matrix.config.artifact }}
        name: ${{ matrix.config.artifact }}

...
